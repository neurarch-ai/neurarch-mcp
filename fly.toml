# fly launch --copy-config --name neurarch-mcp  (then: fly secrets set NEURARCH_MCP_TOKEN=...)
app = "neurarch-mcp"
primary_region = "sjc"

[build]

# The image's default command is hosted STDIO (what Docker MCP Toolkit runs).
# Fly serves the network, so override to Streamable HTTP here. Arguments only:
# the process command is appended to the image ENTRYPOINT (node dist/index.js).
[processes]
  app = "--http --host=0.0.0.0 --hf --tools=core"

# The hosted instance is our own infrastructure and already sees the model
# text a client sends (docs/HOSTED.md, "What the hosted server sees"), so it
# reports the anonymous structure+verdict row the local server only sends
# under an explicit opt-in. Same payload, same policy, stated in HOSTED.md
# and the README privacy section. A local `npx neurarch-mcp` is unaffected.
[env]
  NEURARCH_REPORT = "1"

[http_service]
  internal_port = 8787
  processes = ["app"]
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm. Measured 2026-09-02: a cold start answered the
  # first initialize in 7.5s, which most MCP clients read as a timeout; warm
  # it is 77ms. A shared-cpu-1x at 512MB is about two dollars a month.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
